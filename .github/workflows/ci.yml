name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # SDKs/wire live in sibling repos (not submodules — temporary decision,
      # see ROADMAP). Clone them beside the workspace so tests and the
      # proto drift check can reach their sources via ../vynkor-* paths.
      # Plain git clone: actions/checkout@v7 refuses `path: ../` (repo path
      # must stay under the workspace) since runner 2.319+.
      - name: Clone vynkor-wire (sibling)
        run: git clone --depth 1 https://github.com/vynkor-core/vynkor-wire.git ../vynkor-wire
      - name: Clone vynkor-sdk-cpp (sibling)
        run: git clone --depth 1 https://github.com/vynkor-core/vynkor-sdk-cpp.git ../vynkor-sdk-cpp
      - name: Clone vynkor-sdk-python (sibling)
        run: git clone --depth 1 https://github.com/vynkor-core/vynkor-sdk-python.git ../vynkor-sdk-python

      # E-01: [patch.crates-io] also pins vynkor-sdk to a relative sibling path
      - name: Clone vynkor-sdk (sibling)
        run: git clone --depth 1 https://github.com/vynkor-core/vynkor-sdk.git ../vynkor-sdk

      - name: Proto drift check (T-17)
        run: |
          diff -u ../vynkor-wire/proto/vynkor_protocol.proto ../vynkor-sdk-cpp/proto/vynkor_protocol.proto
          diff -u ../vynkor-wire/proto/vynkor_protocol.proto ../vynkor-sdk-python/proto/vynkor_protocol.proto

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install C++ SDK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev libabsl-dev libssl-dev libzstd-dev libgtest-dev

      - name: "Build C++ SDK echo_plugin (T-02: real C++ binary for cpp integration test)"
        run: |
          cmake -B ../vynkor-sdk-cpp/build -S ../vynkor-sdk-cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build ../vynkor-sdk-cpp/build --target echo_plugin -j"$(nproc)"

      - name: Build
        run: cargo build --all --all-features

      - name: Unit + integration tests
        run: cargo test --all --all-features

      - name: Clippy
        run: cargo clippy --all -- -D warnings

      - name: Format check
        run: cargo fmt --check
